# Optional: use this when the kind cluster was created from the Podman Desktop UI
# with "Setup an ingress controller" enabled. The app is then served on
# http://localhost:9090 (the HTTP port Podman Desktop shows for the cluster).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopcart
  namespace: shopcart
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
