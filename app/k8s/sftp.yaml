apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftp-upload
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp
  labels: { app: sftp }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: sftp }
  template:
    metadata:
      labels: { app: sftp }
    spec:
      containers:
        - name: sftp
          image: localhost/shopcart-sftp:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SFTP_USER
              valueFrom: { secretKeyRef: { name: shopcart-secrets, key: SFTP_USER } }
            - name: SFTP_PASSWORD
              valueFrom: { secretKeyRef: { name: shopcart-secrets, key: SFTP_PASSWORD } }
            # atmoz/sftp format: user:password:uid:gid:folder
            - name: SFTP_USERS
              value: "$(SFTP_USER):$(SFTP_PASSWORD):1001:1001:upload"
          ports:
            - containerPort: 22
          volumeMounts:
            - name: upload
              mountPath: /home/catalog/upload
          readinessProbe:
            tcpSocket: { port: 22 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: sftp-upload
---
apiVersion: v1
kind: Service
metadata:
  name: sftp
spec:
  type: NodePort
  selector: { app: sftp }
  ports:
    - port: 22
      targetPort: 22
      nodePort: 30022
