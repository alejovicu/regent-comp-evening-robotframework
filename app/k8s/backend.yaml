apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: localhost/shopcart-backend:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: shopcart-secrets }
          env:
            - { name: MONGO_URL, value: "mongodb://mongo:27017" }
            - { name: MONGO_DB, value: "shopcart" }
            - { name: SFTP_HOST, value: "sftp" }
            - { name: SFTP_PORT, value: "22" }
            - { name: SFTP_DIR, value: "upload" }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 8000
      targetPort: 8000
