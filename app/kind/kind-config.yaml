# kind cluster for the demo. Maps the NodePorts to your machine:
#   http://localhost:8080  -> web app (frontend NodePort 30080)
#   sftp -P 2222 localhost -> SFTP server (NodePort 30022)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shopcart
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30022
        hostPort: 2222
        protocol: TCP
